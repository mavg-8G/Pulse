name: CI/CD

# push a main → pruebas → imagen en GHCR (firmada) → despliegue en el VPS.
# Otras ramas y PR: solo pruebas. Cada noche: fuzzing largo (sin desplegar).
on:
  push:
  pull_request:
  workflow_dispatch: # "Run workflow" en main: vuelve a construir y desplegar
  schedule:
    - cron: '17 6 * * *'

# Por defecto, el GITHUB_TOKEN solo puede leer. Cada job pide lo justo.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/mavg-8g/pulse # GHCR exige minúsculas
  TRIVY_VERSION: v0.76.0
  # Hash publicado por la release oficial v0.76.0 (Linux x86_64).
  TRIVY_SHA256: e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7
  COSIGN_VERSION: v3.1.3

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - name: Formato y vet
        run: |
          mkdir -p internal/webui/dist && touch internal/webui/dist/.gitkeep
          test -z "$(gofmt -l $(git ls-files '*.go'))" && go vet ./...
      - name: Tests con detector de carreras
        run: go test -race -coverprofile=cover.out ./... && go tool cover -func=cover.out | tail -1
      - name: Fuzzing
        run: |
          T=${{ github.event_name == 'schedule' && '10m' || '30s' }}
          go test ./internal/crypto -run=^$ -fuzz=FuzzOpen -fuzztime=$T
          go test ./internal/passkey -run=^$ -fuzz=FuzzCOSEyAuthData -fuzztime=$T
          go test ./internal/budget -run=^$ -fuzz=FuzzCompute -fuzztime=$T
          go test ./internal/mailparse -run=^$ -fuzz=FuzzParseAmount -fuzztime=$T
          go test ./internal/mailparse -run=^$ -fuzz=FuzzParseDate -fuzztime=$T
          go test ./internal/mailparse -run=^$ -fuzz=FuzzEML -fuzztime=$T
          go test ./internal/gmail -run=^$ -fuzz=FuzzVerifyJWT -fuzztime=$T
          go test ./internal/gmail -run=^$ -fuzz=FuzzCheckState -fuzztime=$T
      - name: Vulnerabilidades conocidas alcanzables (bloquea el despliegue)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # gosec informa en la pestaña Security (Code scanning) sin bloquear: sus hallazgos se revisan a mano.
  gosec:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - run: |
          mkdir -p internal/webui/dist && touch internal/webui/dist/.gitkeep
          go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 -no-fail -fmt sarif -out gosec.sarif -exclude-dir=web ./...
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with: { sarif_file: gosec.sarif, category: gosec }

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: cd web && npm ci && npm run build && npx playwright install --with-deps chromium
      - run: cd web && npx playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with: { name: playwright, path: web/test-results, retention-days: 7 }

  # Imagen: se construye y se prueba SIEMPRE; solo se publica y firma desde main.
  image:
    runs-on: ubuntu-latest
    needs: [e2e]
    if: github.event_name != 'schedule'
    permissions:
      contents: read
      packages: write # publicar en GHCR
      id-token: write # firma sin claves (cosign + OIDC de GitHub)
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      PUBLISH: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Versiones de construcción
        id: versions
        run: |
          echo "node=$(cat .node-version)" >> "$GITHUB_OUTPUT"
          echo "go=$(awk '$1 == "go" {print $2}' go.mod)" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=Pulse
            org.opencontainers.image.description=Registro de gastos personales
      - name: Construir (los tests de Go corren dentro del Dockerfile)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          build-args: |
            NODE_VERSION=${{ steps.versions.outputs.node }}
            GO_VERSION=${{ steps.versions.outputs.go }}
          tags: pulse:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Instalar Trivy (release verificada, con reintentos)
        timeout-minutes: 10
        run: bash scripts/install-trivy.sh
      - name: Escaneo de la imagen (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          image-ref: pulse:ci
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
      - name: Arranca con sistema de archivos de solo lectura y sin capacidades
        run: |
          mkdir -p s d && head -c32 /dev/urandom | base64 > s/kek && sudo chown -R 65532:65532 s d
          docker run -d --name pulse-ci-smoke --read-only --cap-drop ALL --security-opt no-new-privileges -v $PWD/s:/run/secrets:ro -v $PWD/d:/data \
            -e PULSE_BASE_URL=https://pulse.test -e PULSE_KEK_FILE=/run/secrets/kek pulse:ci
          sleep 3 && docker exec pulse-ci-smoke /pulse healthcheck
          docker exec pulse-ci-smoke /pulse backup /data/backups/ci.db
      - name: Logs y limpieza del contenedor de prueba
        if: always()
        run: |
          if docker inspect pulse-ci-smoke >/dev/null 2>&1; then
            docker logs pulse-ci-smoke
            docker rm -f pulse-ci-smoke
          fi
      - name: Entrar en GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - name: Publicar (misma construcción, desde la caché)
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          build-args: |
            NODE_VERSION=${{ steps.versions.outputs.node }}
            GO_VERSION=${{ steps.versions.outputs.go }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.PUBLISH == 'true'
        with: { cosign-release: '${{ env.COSIGN_VERSION }}' }
      - name: Firmar la imagen (el VPS solo despliega imágenes firmadas por este workflow)
        if: env.PUBLISH == 'true'
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"

  deploy:
    runs-on: ubuntu-latest
    needs: [image]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    # Las credenciales del VPS solo existen en este entorno (Settings → Environments → production).
    environment: { name: production, url: 'https://pulse.espectro.uk' }
    concurrency: { group: deploy-production, cancel-in-progress: false }
    steps:
      - name: Desplegar en el VPS
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "digest inválido"; exit 1; }
          [[ -n "$HOST" && -n "$SSH_KEY" && -n "$KNOWN_HOSTS" ]] ||
            { echo "Falta VPS_HOST, VPS_SSH_KEY o VPS_KNOWN_HOSTS en el entorno production"; exit 1; }
          PORT="${PORT:-22}"
          [[ "$PORT" =~ ^[0-9]{1,5}$ ]] && (( 10#$PORT >= 1 && 10#$PORT <= 65535 )) ||
            { echo "VPS_PORT debe ser un puerto entre 1 y 65535"; exit 1; }
          PORT=$((10#$PORT))
          [[ "$HOST" != *[[:space:]]* && "$HOST" != -* && "$HOST" != *@* && "$HOST" != */* && ! "$HOST" =~ ^[^:]+:[0-9]+$ ]] ||
            { echo "VPS_HOST debe contener solo el dominio o IP; configura el puerto aparte en VPS_PORT"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          # Valida sin imprimir la clave ni intentar una conexión con una identidad ilegible.
          if ! ssh-keygen -y -P '' -f ~/.ssh/deploy >/dev/null 2>&1; then
            echo "::error::VPS_SSH_KEY debe ser la clave privada completa y sin contraseña (archivo pulse_deploy, no pulse_deploy.pub). Conserva BEGIN/END y saltos de línea reales."
            exit 1
          fi
          # Huella fija: nada de "aceptar cualquier servidor". Del secreto solo se toma el tipo y la clave
          # (admite la salida completa de ssh-keyscan) y se asocian al host/puerto reales del despliegue.
          KEY="$(grep -v '^#' <<<"$KNOWN_HOSTS" | grep -oE 'ssh-ed25519 [A-Za-z0-9+/=]+' | sort -u)" ||
            { echo "VPS_KNOWN_HOSTS no contiene una clave ssh-ed25519 (usa: ssh-keyscan -t ed25519 <host>)"; exit 1; }
          [[ "$KEY" != *$'\n'* ]] ||
            { echo "VPS_KNOWN_HOSTS contiene varias claves ED25519 distintas; conserva solo la del VPS verificada"; exit 1; }
          if [[ "$PORT" == 22 ]]; then printf '%s %s\n' "$HOST" "$KEY"; else printf '[%s]:%s %s\n' "$HOST" "$PORT" "$KEY"; fi > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -lf ~/.ssh/known_hosts >/dev/null ||
            { echo "La clave ED25519 de VPS_KNOWN_HOSTS no tiene un formato válido"; exit 1; }
          # La clave solo puede ejecutar deploy.sh en el VPS (comando forzado); esto son sus argumentos.
          ssh -i ~/.ssh/deploy -p "$PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ServerAliveInterval=15 "deploy@${HOST}" "deploy ${DIGEST} ${GITHUB_SHA}"
      - name: Borrar la clave
        if: always()
        run: rm -f ~/.ssh/deploy
