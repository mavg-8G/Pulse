# /opt/docker/pulse/docker-compose.yml
# Antes del primer arranque, ver deploy/README.md (clave maestra y permisos).
services:
  pulse:
    # La imagen la construye y firma GitHub Actions; deploy.sh escribe el digest en release.env
    # y arranca con: docker compose --env-file release.env up -d
    image: ${PULSE_IMAGE:?falta PULSE_IMAGE - usa deploy.sh o --env-file release.env}
    container_name: pulse
    restart: unless-stopped
    env_file: .env            # solo configuración NO secreta
    environment:
      PULSE_KEK_FILE: /run/secrets/pulse_kek
      PULSE_VAPID_PRIVATE_FILE: /run/secrets/vapid_private
      # Gmail (ver GMAIL.md): descomenta junto con los secretos de abajo.
      # PULSE_GOOGLE_CLIENT_SECRET_FILE: /run/secrets/google_client_secret
      # PULSE_GEMINI_KEY_FILE: /run/secrets/gemini_key
      # Respaldo externo cifrado (ver README.md): descomenta el secreto del destino que uses.
      # PULSE_BACKUP_S3_SECRET_FILE: /run/secrets/backup_s3_secret
      # PULSE_BACKUP_WEBDAV_PASSWORD_FILE: /run/secrets/backup_webdav_password
      # PULSE_BACKUP_GDRIVE_CLIENT_SECRET_FILE: /run/secrets/backup_gdrive_client_secret
      # PULSE_BACKUP_GDRIVE_TOKEN_FILE: /run/secrets/backup_gdrive_token
    secrets:
      - pulse_kek
      - vapid_private
      # - google_client_secret
      # - gemini_key
      # - backup_s3_secret
      # - backup_webdav_password
      # - backup_gdrive_client_secret
      # - backup_gdrive_token
    volumes:
      - ./data:/data          # pulse.db y backups/ (propiedad de uid 65532)
      - /opt/backup/pulse:/backups  # respaldos cifrados locales (sudo install -d -o 65532 -g 65532 -m 700 /opt/backup/pulse)
    networks:
      - proxy                 # sin "ports:": solo Caddy llega al contenedor
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 128
    healthcheck:
      test: ["CMD", "/pulse", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

secrets:
  pulse_kek:
    file: ./secrets/pulse_kek
  vapid_private:
    file: ./secrets/vapid_private
  # google_client_secret:
  #   file: ./secrets/google_client_secret
  # gemini_key:                 # opcional
  #   file: ./secrets/gemini_key
  # backup_s3_secret:
  #   file: ./secrets/backup_s3_secret
  # backup_webdav_password:
  #   file: ./secrets/backup_webdav_password
  # backup_gdrive_client_secret:
  #   file: ./secrets/backup_gdrive_client_secret
  # backup_gdrive_token:
  #   file: ./secrets/backup_gdrive_token

networks:
  proxy:
    external: true
